[project]
name = "humanfia-humanize-codex"
version = "0.3.0"
description = "Humanfia Humanize dynamic workflows for Codex"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["hmz[dsh]==0.2.1", "mcp>=1.26,<2", "psutil>=7.2,<8"]

[project.scripts]
humanize-codex = "humanize_codex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/humanize_codex"]

[tool.hatch.build]
exclude = ["/output/", "/.venv/", "/dist/", "/.pytest_cache/", "/.ruff_cache/", "**/__pycache__/"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["output", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
